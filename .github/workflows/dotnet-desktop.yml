
name: Build Wand Enhancer

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build application
        shell: pwsh
        run: .\build.cmd

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer-Windows
          path: WandEnhancer\bin\Release\
          if-no-files-found: error
